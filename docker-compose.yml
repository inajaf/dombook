# Local development environment.
#
# `postgres` is the Go server's database. A local PostgreSQL installed via
# Homebrew works just as well; this service exists so a new machine or CI can
# reach the same schema without manual setup.
#
# The API is deliberately NOT a compose service: it is the Go server in ./server.
# Build and run it with `go run ./cmd/api` (server/README.md lists the DSN and
# JWT_SECRET it requires). The legacy Cloudflare Workers API that used to be built
# here was removed — see server/CUTOVER.md.

services:
  postgres:
    image: postgres:16
    container_name: dombook-postgres
    environment:
      POSTGRES_USER: dombook
      POSTGRES_PASSWORD: dombook
      POSTGRES_DB: dombook_dev
      # Deterministic collation: citext uniqueness and ORDER BY must not change
      # meaning between the developer's macOS cluster and the CI container.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    ports:
      # Non-default host port to avoid colliding with a Homebrew PostgreSQL on 5432.
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dombook -d dombook_dev"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
