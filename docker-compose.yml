# The development database.
#
# Start it with `scripts/db.sh up`, not `docker compose up` — the script also creates
# rentkeeper_test, which the Go integration tests need and this file alone does not provide.
# Host, port and credentials live in scripts/db-env.sh, which every other script sources.
#
# A native PostgreSQL works just as well; override RENTKEEPER_DB_HOST/PORT/USER to use it.
# This service is the default because a container reproduces the same version and collation
# everywhere, which a Homebrew install does not.
#
# The API is deliberately NOT a compose service: it is the Go server in ./server.
# Build and run it with `go run ./cmd/api` (server/README.md lists the DSN and
# JWT_SECRET it requires). The legacy Cloudflare Workers API that used to be built
# here was removed — see server/CUTOVER.md.

services:
  postgres:
    image: postgres:16
    container_name: rentkeeper-postgres
    environment:
      POSTGRES_USER: rentkeeper
      POSTGRES_PASSWORD: rentkeeper
      POSTGRES_DB: rentkeeper_dev
      # Deterministic collation: citext uniqueness and ORDER BY must not change
      # meaning between the developer's macOS cluster and the CI container.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    ports:
      # Non-default host port to avoid colliding with a Homebrew PostgreSQL on 5432.
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentkeeper -d rentkeeper_dev"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
