name: Server (Go)

# The server suite is the only place tenant isolation is actually exercised, and
# its integration tests SKIP when DOMBOOK_TEST_DSN is unset (see server/README.md).
# Without this workflow nothing runs them automatically, so RLS could be dropped
# from a table and every check would still be green. The postgres service below
# exists to keep them running rather than skipping.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dombook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dombook_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # `go test -p 1` is required, not an optimization: every integration test
      # package shares this one database and each one resets the schema. See
      # server/README.md.
      DOMBOOK_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/dombook_test?sslmode=disable

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -p 1 -race -count=1 -timeout 15m ./...
