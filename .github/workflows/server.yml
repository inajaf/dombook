name: Server (Go)

# The server suite is the only place tenant isolation is actually exercised, and
# its integration tests SKIP when RENTKEEPER_TEST_DSN is unset (see server/README.md).
# Without this workflow nothing runs them automatically, so RLS could be dropped
# from a table and every check would still be green.
#
# This job runs scripts/check-all.sh rather than repeating the commands. The script is what a
# developer and an agent run locally, and the database it targets comes from the same compose
# file and the same scripts/db.sh — so CI cannot drift onto a different PostgreSQL version or
# a different port than a laptop uses.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - run: npm ci

      # The container publishes 55432 on the host, which is where the scripts look.
      - name: Start the database
        run: scripts/db.sh up

      # `-p 1` (inside the script) is required, not an optimisation: every integration test
      # package shares one database and each resets the schema. See server/README.md.
      - name: All checks
        run: scripts/check-all.sh
